[package]
name = "echo-usage-examples"
description = "Example usages of Echo"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Chainbound Developers <dev@chainbound.io>"]
repository = "https://github.com/chainbound/echo-usage-examples"
homepage = "https://github.com/chainbound/echo-usage-examples"

[dependencies]
eyre = "0.6.12"
inquire = "0.6.2"
tracing = "0.1.40"
serde = "1.0.193"
futures = "0.3"
serde_json = "1.0.108"
tracing-subscriber = "0.3.18"
clap = { version = "4.4.8", features = ["derive"] }
alloy = { version = "0.11.0", features = ["full", "json-rpc"] }
tokio = { version = "1.27", features = ["full"] }
async-trait = "0.1.74"
